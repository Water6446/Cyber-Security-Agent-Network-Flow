<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#41535f"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b07a1e"/>
    </marker>
  </defs>

  <rect width="960" height="760" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="21" font-weight="600" fill="#16232c">Network Analyst Agent — Architecture (Week 2)</text>
  <text x="480" y="54" text-anchor="middle" font-size="12" fill="#5c6d78">code computes · the LLM interprets · ground truth stays quarantined</text>

  <!-- CSV input -->
  <rect x="40" y="76" width="300" height="56" rx="8" fill="#eef3f7" stroke="#8fa6b4"/>
  <text x="190" y="99" text-anchor="middle" font-size="13" font-weight="600" fill="#16232c">CIC-IDS2017 flow CSV</text>
  <text x="190" y="118" text-anchor="middle" font-size="10.5" fill="#5c6d78">Tuesday-WorkingHours — 445,909 flows × 85 columns</text>
  <line x1="190" y1="132" x2="190" y2="162" stroke="#41535f" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 1 DATA LAYER -->
  <rect x="40" y="164" width="560" height="104" rx="10" fill="#e7f0ea" stroke="#4d8a63" stroke-width="1.5"/>
  <text x="56" y="188" font-size="14" font-weight="700" fill="#2c5e3f">1 · DATA LAYER</text>
  <text x="200" y="188" font-size="11" fill="#4d6a58">pandas — deterministic load &amp; clean</text>
  <text x="56" y="211" font-size="11.5" fill="#31463a">• strip stray spaces in column names  •  Infinity → NA  •  latin-1 fallback</text>
  <text x="56" y="231" font-size="11.5" fill="#31463a">• split the file:  df = what the agent sees (Label column removed)</text>
  <text x="120" y="253" font-size="11.5" font-weight="600" fill="#a34a2a">labels (ground truth) are exiled to the eval sidecar →</text>

  <line x1="320" y1="268" x2="320" y2="300" stroke="#41535f" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 2 TOOL LAYER -->
  <rect x="40" y="302" width="560" height="128" rx="10" fill="#e8eef7" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="56" y="326" font-size="14" font-weight="700" fill="#2d4a75">2 · TOOL LAYER</text>
  <text x="200" y="326" font-size="11" fill="#4a5f7d">narrow · deterministic · capped (≤10 rows, ≤4,000 chars)</text>
  <g font-size="11.5" fill="#22364f" font-family="Consolas, monospace">
    <rect x="56"  y="338" width="166" height="26" rx="6" fill="#ffffff" stroke="#9db2cc"/><text x="139" y="355" text-anchor="middle">get_overview()</text>
    <rect x="236" y="338" width="166" height="26" rx="6" fill="#ffffff" stroke="#9db2cc"/><text x="319" y="355" text-anchor="middle">get_stats(col)</text>
    <rect x="416" y="338" width="166" height="26" rx="6" fill="#ffffff" stroke="#9db2cc"/><text x="499" y="355" text-anchor="middle">find_outliers(col)</text>
    <rect x="56"  y="372" width="166" height="26" rx="6" fill="#ffffff" stroke="#9db2cc"/><text x="139" y="389" text-anchor="middle">query_flows(expr)</text>
    <rect x="236" y="372" width="166" height="26" rx="6" fill="#fff7e0" stroke="#c9a53f"/><text x="319" y="389" text-anchor="middle">count_by(expr,col)</text>
    <rect x="416" y="372" width="166" height="26" rx="6" fill="#fff7e0" stroke="#c9a53f"/><text x="499" y="389" text-anchor="middle">top_talkers(n)</text>
  </g>
  <text x="56" y="418" font-size="10.5" fill="#4a5f7d">errors go back to the model as JSON — highlighted tools answer &#8220;who did what?&#8221;</text>

  <!-- loop arrows between tool layer and agent loop -->
  <line x1="250" y1="430" x2="250" y2="470" stroke="#41535f" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="240" y="454" text-anchor="end" font-size="10.5" fill="#5c6d78">JSON results (truncated)</text>
  <line x1="390" y1="472" x2="390" y2="432" stroke="#41535f" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="400" y="454" font-size="10.5" fill="#5c6d78">tool calls (batched)</text>

  <!-- 3 AGENT LOOP -->
  <rect x="40" y="472" width="560" height="126" rx="10" fill="#f3ecf7" stroke="#7d5ba6" stroke-width="1.5"/>
  <text x="56" y="496" font-size="14" font-weight="700" fill="#5a3d80">3 · AGENT LOOP</text>
  <text x="205" y="496" font-size="11" fill="#63537d">one while-loop runs the whole investigation</text>
  <text x="56" y="519" font-size="11.5" fill="#463659">• model picks a tool → code runs it → result goes back → repeat, up to 12 turns</text>
  <text x="56" y="539" font-size="11.5" fill="#463659">• the model knows its budget; on the last turn tools shut off and it must report</text>
  <text x="56" y="559" font-size="11.5" fill="#463659">• every claim must cite a tool result — the model cannot invent numbers</text>
  <text x="56" y="579" font-size="11.5" fill="#463659">• temperature 0.1 for repeatable runs; a small shim adapts to each provider&#8217;s API</text>

  <!-- providers -->
  <line x1="320" y1="644" x2="320" y2="600" stroke="#41535f" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="40" y="646" width="560" height="64" rx="10" fill="#f7f7f2" stroke="#a6a690" stroke-width="1.3"/>
  <text x="56" y="668" font-size="12.5" font-weight="700" fill="#4f4f3c">PROVIDERS — pick one with --provider, zero code changes</text>
  <g font-size="10.5" fill="#3c3c2e">
    <rect x="52"  y="678" width="140" height="24" rx="6" fill="#ffffff" stroke="#c2c2ab"/><text x="122" y="694" text-anchor="middle">ollama · qwen2.5 (local)</text>
    <rect x="202" y="678" width="118" height="24" rx="6" fill="#ffffff" stroke="#c2c2ab"/><text x="261" y="694" text-anchor="middle">claude · haiku-4-5</text>
    <rect x="330" y="678" width="128" height="24" rx="6" fill="#ffffff" stroke="#c2c2ab"/><text x="394" y="694" text-anchor="middle">openai · gpt-4o-mini</text>
    <rect x="468" y="678" width="112" height="24" rx="6" fill="#ffffff" stroke="#c2c2ab"/><text x="524" y="694" text-anchor="middle">custom (env vars)</text>
  </g>

  <!-- EVAL SIDECAR -->
  <rect x="632" y="140" width="304" height="570" rx="12" fill="none" stroke="#b07a1e" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="784" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#8a5f14">EVAL SIDECAR</text>
  <text x="784" y="184" text-anchor="middle" font-size="10.5" fill="#8a5f14">yours, not the agent&#8217;s — the agent NEVER sees it</text>

  <rect x="652" y="202" width="264" height="74" rx="8" fill="#fdf3e3" stroke="#c9a53f"/>
  <text x="784" y="226" text-anchor="middle" font-size="12.5" font-weight="600" fill="#6b4a10">labels — the Label column</text>
  <text x="784" y="245" text-anchor="middle" font-size="10.5" fill="#7d5c22">BENIGN · FTP-Patator · SSH-Patator …</text>
  <text x="784" y="263" text-anchor="middle" font-size="10.5" fill="#a34a2a">the answer key, quarantined at load time</text>
  <line x1="602" y1="248" x2="650" y2="236" stroke="#b07a1e" stroke-width="1.5" marker-end="url(#arrowAmber)"/>

  <line x1="784" y1="276" x2="784" y2="546" stroke="#b07a1e" stroke-width="1.5" marker-end="url(#arrowAmber)"/>

  <rect x="652" y="452" width="264" height="58" rx="8" fill="#eef3f7" stroke="#8fa6b4"/>
  <text x="784" y="476" text-anchor="middle" font-size="12" font-weight="600" fill="#16232c">findings_&lt;date-time&gt;_&lt;model&gt;.md</text>
  <text x="784" y="494" text-anchor="middle" font-size="10.5" fill="#5c6d78">plain-language report, evidence cited</text>
  <line x1="602" y1="505" x2="650" y2="488" stroke="#41535f" stroke-width="1.6" marker-end="url(#arrow)"/>

  <line x1="700" y1="510" x2="700" y2="546" stroke="#41535f" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="652" y="548" width="264" height="110" rx="8" fill="#fdf3e3" stroke="#c9a53f"/>
  <text x="784" y="572" text-anchor="middle" font-size="12.5" font-weight="600" fill="#6b4a10">evaluate_findings()</text>
  <text x="666" y="596" font-size="10" fill="#5c4a20">• per attack: HIT / PARTIAL / MISS</text>
  <text x="666" y="616" font-size="10" fill="#5c4a20">• benign IPs named → candidate false positives</text>
  <text x="666" y="636" font-size="10" fill="#5c4a20">• compare_findings.py diffs runs &amp; models</text>
</svg>
