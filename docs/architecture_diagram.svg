<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 812" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#41535f"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b07a1e"/>
    </marker>
  </defs>

  <rect width="960" height="812" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="21" font-weight="600" fill="#16232c">Network Analyst Agent — Architecture (Week 4)</text>
  <text x="480" y="54" text-anchor="middle" font-size="12" fill="#5c6d78">code computes · the LLM interprets · ground truth stays quarantined</text>
  <text x="480" y="72" text-anchor="middle" font-size="10.5" fill="#7b8b96">agent 1 of 4 — see docs/workflow_diagram.png for the full graph and its two capped feedback edges</text>

  <!-- CSV input -->
  <rect x="40" y="86" width="300" height="56" rx="8" fill="#eef3f7" stroke="#8fa6b4"/>
  <text x="190" y="109" text-anchor="middle" font-size="13" font-weight="600" fill="#16232c">CIC-IDS2017 flow CSV</text>
  <text x="190" y="128" text-anchor="middle" font-size="10.5" fill="#5c6d78">Tuesday-WorkingHours — 445,909 flows × 85 columns</text>
  <line x1="190" y1="142" x2="190" y2="172" stroke="#41535f" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 1 DATA LAYER -->
  <rect x="40" y="174" width="560" height="118" rx="10" fill="#e7f0ea" stroke="#4d8a63" stroke-width="1.5"/>
  <text x="56" y="198" font-size="14" font-weight="700" fill="#2c5e3f">1 · DATA LAYER</text>
  <text x="200" y="198" font-size="11" fill="#4d6a58">datasets/ adapter → canonical schema, then pandas</text>
  <text x="56" y="221" font-size="11.5" fill="#31463a">• schema probing is mandatory — an unknown header RAISES, it never nulls</text>
  <text x="56" y="241" font-size="11.5" fill="#31463a">• strip stray spaces in column names  •  Infinity → NA  •  latin-1 fallback</text>
  <text x="56" y="261" font-size="11.5" fill="#31463a">• split the file:  df = what the agent sees (Label column removed, 84 cols)</text>
  <text x="120" y="282" font-size="11.5" font-weight="600" fill="#a34a2a">labels (ground truth) are exiled to the eval sidecar →</text>

  <line x1="320" y1="292" x2="320" y2="322" stroke="#41535f" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 2 TOOL LAYER -->
  <rect x="40" y="324" width="560" height="182" rx="10" fill="#e8eef7" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="56" y="348" font-size="14" font-weight="700" fill="#2d4a75">2 · TOOL LAYER — 10 tools</text>
  <text x="250" y="348" font-size="11" fill="#4a5f7d">narrow · deterministic · capped (≤10 rows, ≤4,000 chars)</text>
  <g font-size="11" fill="#22364f" font-family="Consolas, monospace">
    <rect x="56"  y="360" width="166" height="26" rx="6" fill="#ffffff" stroke="#9db2cc"/><text x="139" y="377" text-anchor="middle">get_overview()</text>
    <rect x="236" y="360" width="166" height="26" rx="6" fill="#ffffff" stroke="#9db2cc"/><text x="319" y="377" text-anchor="middle">get_stats(col)</text>
    <rect x="416" y="360" width="166" height="26" rx="6" fill="#ffffff" stroke="#9db2cc"/><text x="499" y="377" text-anchor="middle">find_outliers(col)</text>
    <rect x="56"  y="394" width="166" height="26" rx="6" fill="#ffffff" stroke="#9db2cc"/><text x="139" y="411" text-anchor="middle">query_flows(expr)</text>
    <rect x="236" y="394" width="166" height="26" rx="6" fill="#fff7e0" stroke="#c9a53f"/><text x="319" y="411" text-anchor="middle">count_by(expr,col,col2)</text>
    <rect x="416" y="394" width="166" height="26" rx="6" fill="#fff7e0" stroke="#c9a53f"/><text x="499" y="411" text-anchor="middle">top_talkers(n)</text>
    <rect x="56"  y="428" width="166" height="26" rx="6" fill="#e6f2ee" stroke="#4d8a63"/><text x="139" y="445" text-anchor="middle">host_profile(ip)</text>
    <rect x="236" y="428" width="166" height="26" rx="6" fill="#e6f2ee" stroke="#4d8a63"/><text x="319" y="445" text-anchor="middle">flag_summary(expr)</text>
    <rect x="416" y="428" width="166" height="26" rx="6" fill="#e6f2ee" stroke="#4d8a63"/><text x="499" y="445" text-anchor="middle">flows_in_time_range()</text>
    <rect x="56"  y="462" width="166" height="26" rx="6" fill="#ffffff" stroke="#9db2cc"/><text x="139" y="479" text-anchor="middle">flow_time_range(expr)</text>
  </g>
  <text x="236" y="477" font-size="10.5" fill="#4a5f7d">amber = &#8220;who did what?&#8221;   green = added from the agents&#8217; own</text>
  <text x="236" y="493" font-size="10.5" fill="#4a5f7d">tool feedback (Week 4) — errors return to the model as JSON</text>

  <!-- loop arrows between tool layer and agent loop -->
  <line x1="250" y1="506" x2="250" y2="542" stroke="#41535f" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="240" y="530" text-anchor="end" font-size="10.5" fill="#5c6d78">JSON results (truncated)</text>
  <line x1="390" y1="544" x2="390" y2="508" stroke="#41535f" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="400" y="530" font-size="10.5" fill="#5c6d78">tool calls (batched)</text>

  <!-- 3 AGENT LOOP -->
  <rect x="40" y="544" width="560" height="146" rx="10" fill="#f3ecf7" stroke="#7d5ba6" stroke-width="1.5"/>
  <text x="56" y="568" font-size="14" font-weight="700" fill="#5a3d80">3 · AGENT LOOP</text>
  <text x="205" y="568" font-size="11" fill="#63537d">agent_core.run_agent() — shared by all four agents</text>
  <text x="56" y="591" font-size="11.5" fill="#463659">• model picks a tool → code runs it → result goes back → repeat, up to 12 turns</text>
  <text x="56" y="611" font-size="11.5" fill="#463659">• the model knows its budget; on the last turn tools shut off and it must report</text>
  <text x="56" y="631" font-size="11.5" fill="#463659">• every claim must cite a tool result — the model cannot invent numbers</text>
  <text x="56" y="651" font-size="11.5" fill="#463659">• temperature 0.1 for repeatable runs; a shim adapts to each provider&#8217;s API</text>
  <text x="56" y="671" font-size="11.5" fill="#463659">• transient network errors retry with exponential backoff, not a lost run</text>

  <!-- providers -->
  <line x1="320" y1="736" x2="320" y2="692" stroke="#41535f" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="40" y="738" width="560" height="64" rx="10" fill="#f7f7f2" stroke="#a6a690" stroke-width="1.3"/>
  <text x="56" y="760" font-size="12.5" font-weight="700" fill="#4f4f3c">PROVIDERS — pick one with --provider, zero code changes</text>
  <g font-size="10.5" fill="#3c3c2e">
    <rect x="52"  y="770" width="140" height="24" rx="6" fill="#ffffff" stroke="#c2c2ab"/><text x="122" y="786" text-anchor="middle">ollama · qwen2.5 (local)</text>
    <rect x="202" y="770" width="118" height="24" rx="6" fill="#ffffff" stroke="#c2c2ab"/><text x="261" y="786" text-anchor="middle">claude · haiku-4-5</text>
    <rect x="330" y="770" width="128" height="24" rx="6" fill="#ffffff" stroke="#c2c2ab"/><text x="394" y="786" text-anchor="middle">openai · gpt-4o-mini</text>
    <rect x="468" y="770" width="112" height="24" rx="6" fill="#ffffff" stroke="#c2c2ab"/><text x="524" y="786" text-anchor="middle">custom (env vars)</text>
  </g>

  <!-- EVAL SIDECAR -->
  <rect x="632" y="150" width="304" height="652" rx="12" fill="none" stroke="#b07a1e" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="784" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#8a5f14">EVAL SIDECAR</text>
  <text x="784" y="194" text-anchor="middle" font-size="10.5" fill="#8a5f14">yours, not the agent&#8217;s — no agent ever sees it</text>

  <rect x="652" y="212" width="264" height="92" rx="8" fill="#fdf3e3" stroke="#c9a53f"/>
  <text x="784" y="236" text-anchor="middle" font-size="12.5" font-weight="600" fill="#6b4a10">ground truth, all of it</text>
  <text x="784" y="255" text-anchor="middle" font-size="10.5" fill="#7d5c22">the Label column · DAPT phase stages</text>
  <text x="784" y="273" text-anchor="middle" font-size="10.5" fill="#7d5c22">the ATT&amp;CK answer key · the tactic→phase crosswalk</text>
  <text x="784" y="291" text-anchor="middle" font-size="10.5" fill="#a34a2a">quarantined at load time; a grep test enforces it</text>
  <line x1="602" y1="272" x2="650" y2="256" stroke="#b07a1e" stroke-width="1.5" marker-end="url(#arrowAmber)"/>

  <line x1="784" y1="304" x2="784" y2="500" stroke="#b07a1e" stroke-width="1.5" marker-end="url(#arrowAmber)"/>

  <rect x="652" y="406" width="264" height="58" rx="8" fill="#eef3f7" stroke="#8fa6b4"/>
  <text x="784" y="430" text-anchor="middle" font-size="12" font-weight="600" fill="#16232c">outputs/&lt;run&gt;/findings.md · .json</text>
  <text x="784" y="448" text-anchor="middle" font-size="10.5" fill="#5c6d78">plain-language report, evidence cited</text>
  <line x1="602" y1="452" x2="650" y2="440" stroke="#41535f" stroke-width="1.6" marker-end="url(#arrow)"/>

  <line x1="700" y1="464" x2="700" y2="500" stroke="#41535f" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="652" y="502" width="264" height="146" rx="8" fill="#fdf3e3" stroke="#c9a53f"/>
  <text x="784" y="526" text-anchor="middle" font-size="12.5" font-weight="600" fill="#6b4a10">three scorers, all post-hoc</text>
  <text x="666" y="550" font-size="9.2" fill="#5c4a20">• evaluate_findings() — HIT / PARTIAL / MISS</text>
  <text x="666" y="568" font-size="9.2" fill="#5c4a20">   + benign IPs named → candidate false positives</text>
  <text x="666" y="588" font-size="9.2" fill="#5c4a20">• evaluate_mappings() — CORRECT / PLAUSIBLE / WRONG</text>
  <text x="666" y="606" font-size="9.2" fill="#5c4a20">   + verify_answer_key() against live ATT&amp;CK</text>
  <text x="666" y="626" font-size="9.2" fill="#5c4a20">• evaluate_phases() — primary / alternate / disagree</text>

  <rect x="652" y="672" width="264" height="70" rx="8" fill="#eef3f7" stroke="#8fa6b4"/>
  <text x="784" y="696" text-anchor="middle" font-size="12" font-weight="600" fill="#16232c">outputs/&lt;run&gt;/manifest.json</text>
  <text x="784" y="714" text-anchor="middle" font-size="10.5" fill="#5c6d78">params, model, profile hash, injected</text>
  <text x="784" y="731" text-anchor="middle" font-size="10.5" fill="#5c6d78">sections, node visits, retries, git SHA</text>
</svg>
